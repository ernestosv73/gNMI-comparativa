username: admin
password: NokiaSrl1!
insecure: false
skip-verify: true
encoding: json_ietf
timeout: 10s

targets:
  srlswitch2:
    address: srlswitch2:57400
    
subscriptions:    

  srl-system-performance:
    mode: stream
    stream-mode: sample
    sample-interval: 5s
    paths:
      - /platform/control[slot=*]/cpu[index=*]/total/average-1
  
  srl-if-stats-stream:
    mode: stream
    stream-mode: sample
    sample-interval: 5s
    paths:
      - /interface[name=ethernet-1/*]/statistics/in-unicast-packets
      - /interface[name=ethernet-1/*]/statistics/in-octets
      - /interface[name=ethernet-1/*]/statistics/in-multicast-packets
      - /interface[name=ethernet-1/*]/statistics/out-unicast-packets
      - /interface[name=ethernet-1/*]/statistics/out-octets
      - /interface[name=ethernet-1/*]/statistics/out-multicast-packets
      - /interface[name=ethernet-1/*]/traffic-rate/in-bps
      - /interface[name=ethernet-1/*]/traffic-rate/out-bps
  srl-if-stats-on-change:   
    mode: stream
    stream-mode: on-change
    heartbeat-interval: 5s  
    suppress-redundant: true
    paths:
      - /interface[name=ethernet-1/*]/statistics/in-discarded-packets
      - /interface[name=ethernet-1/*]/statistics/in-error-packets
      - /interface[name=ethernet-1/*]/statistics/in-broadcast-packets
      - /interface[name=ethernet-1/*]/statistics/out-discarded-packets
      - /interface[name=ethernet-1/*]/statistics/out-error-packets
      - /interface[name=ethernet-1/*]/statistics/out-broadcast-packets
      
outputs:
  
  prom-output:
    type: prometheus
    listen: :9273        
